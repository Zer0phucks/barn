name: Redeploy On Main

on:
  push:
    branches:
      - main

jobs:
  redeploy:
    runs-on: ubuntu-latest

    steps:
      - name: Start ssh-agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust deploy host
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${DEPLOY_PORT:-22}" "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Run redeploy script on host
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_REPO_DIR: ${{ secrets.DEPLOY_REPO_DIR }}
        run: |
          REPO_DIR="$(printf '%s' "${DEPLOY_REPO_DIR:-/home/nsnfrd768_gmail_com/barn}" | tr -d '\r\n')"
          DEPLOY_HOST_CLEAN="$(printf '%s' "${DEPLOY_HOST}" | tr -d '\r\n')"
          DEPLOY_USER_CLEAN="$(printf '%s' "${DEPLOY_USER}" | tr -d '\r\n')"
          DEPLOY_PORT_CLEAN="$(printf '%s' "${DEPLOY_PORT:-22}" | tr -d '\r\n')"
          ssh -p "${DEPLOY_PORT_CLEAN:-22}" "${DEPLOY_USER_CLEAN}@${DEPLOY_HOST_CLEAN}" \
            "cd '${REPO_DIR}' && ./deploy.sh"
